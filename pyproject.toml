[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-voice-translation"
version = "0.1.0"
description = "Research prototype for voice-preserving speech translation and typed-text voice cloning"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
app = ["gradio==5.50.0"]
research = ["datasets>=3,<5"]
voice = ["gradio==5.50.0", "coqui-tts[codec]==0.27.5", "faster-whisper==1.2.1", "torch>=2.6,<2.12", "torchaudio>=2.6,<2.12", "transformers==4.57.6", "fastrtc[vad]==0.0.34", "spacy>=3.8,<3.9"]

[tool.setuptools.packages.find]
where = ["src"]
